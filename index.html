<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<title>Specified dams - India</title>

<link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/light/main.css" />
<script src="https://js.arcgis.com/4.29/"></script>

<style>
  html, body, #viewDiv {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }

  /* ───────── Controls panel ───────── */
  #controls {
    position: absolute;
    top: 12px;
    left: 12px;
    background: white;
    padding: 14px;
    z-index: 99;
    font-size: 13px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.3);
    width: 340px;
    border-radius: 10px;
    max-height: calc(100vh - 24px);
    overflow-y: auto;
    transition: transform 0.3s ease;
  }

  #controls.collapsed {
    transform: translateY(-90%);
  }

  input[type="text"], select {
    box-sizing: border-box;
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 16px; 
  }

  .section {
    font-weight: bold;
    margin-top: 10px;
  }

  #results {
    max-height: 35vh;
    overflow-y: auto;
    border: 1px solid #ccc;
    border-radius: 6px;
    display: none;
  }

  .result-item {
    padding: 10px;
    cursor: pointer;
  }

  .result-item:hover,
  .result-item.active {
    background: #e6e6e6;
  }

  .search-wrap {
    position: relative;
  }

  #clearSearch {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    font-size: 22px;
    cursor: pointer;
    display: none;
  }

.esri-view-width-xsmall .esri-popup__main-container,
.esri-view-width-small .esri-popup__main-container {
  width: 98vw !important; 
  max-width: 98vw !important;
  margin: 0 auto !important;
  left: 1vw !important; 
}

.esri-view-width-xsmall .esri-popup__content,
.esri-view-width-small .esri-popup__content {
  padding: 0 !important;
  margin: 0 !important;
}

.esri-feature-fields__table {
  width: 100% !important;
  table-layout: fixed !important; 
  border-collapse: collapse !important;
  margin: 0 !important;
}

.esri-feature-fields__field-header {
  width: 30% !important;
  min-width: 30% !important;
  max-width: 30% !important;
  padding: 10px 6px !important;
  word-break: break-word !important;
  border-right: 1px solid #e0e0e0 !important; 
}

.esri-feature-fields__field-value {
  width: 70% !important;
  min-width: 70% !important;
  max-width: 70% !important;
  padding: 10px 8px !important;
  word-break: break-word !important;
}

.esri-view-width-greater-than-small .esri-popup__main-container {
  width: 500px !important;
}

.esri-feature-fields__field-header,
.esri-feature-fields__field-value {
  font-family: Arial, sans-serif !important;
  font-size: 13px !important;
  font-weight: 400 !important;
  color: #333 !important;
}

  @media (max-width: 768px) {
    #controls {
      width: 94%;
      left: 50% !important; 
      transform: translateX(-50%); 
      top: auto;
      bottom: 12px;
      border-radius: 14px;
      margin: 0; 
      box-sizing: border-box;
    }

    #controls.collapsed {
      transform: translate(-50%, calc(100% - 45px)) !important;
    }
  }
</style>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-58510VNE1R"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-58510VNE1R', { anonymize_ip: true });
</script>
</head>
<body>

<div id="controls">
  <div id="search-container">
    <div class="section">Search Dam</div>
    <div class="search-wrap">
      <input type="text" id="damSearch" placeholder="Type dam name…" />
      <button id="clearSearch" title="Clear">×</button>
    </div>
    <div id="results"></div>
  </div>

  <div id="toggle-container">
    <div class="section">Filter by State</div>
    <select id="stateFilter">
      <option value="">— All States —</option>
    </select>

    <div class="section">Filter by SDSO</div>
    <select id="sdsoFilter">
      <option value="">— All SDSOs —</option>
    </select>

    <div class="section">Basemap</div>
    <select id="basemapSelect">
      <option value="satellite" selected>Satellite</option>
      <option value="hybrid">Hybrid</option>
      <option value="topo">Topographic</option>
      <option value="streets">Street</option>
      <option value="none">No basemap</option>
    </select>

    <div class="section">Layers</div>
    <label><input type="checkbox" id="stateChk" checked> State Boundary</label><br>
    <label><input type="checkbox" id="districtChk"> District Boundary</label><br>
    <label><input type="checkbox" id="riverChk"> River</label><br>
    <label><input type="checkbox" id="riverBasinsChk"> River Basins</label><br>
    <label><input type="checkbox" id="damChk" checked> Dams</label><br>
    <label><input type="checkbox" id="hoChk"> HO Sites</label>
  </div>
</div>

<div id="viewDiv"></div>

<script>
const worldLocator = "https://geocode-api.arcgis.com/arcgis/rest/services/World/GeocodeServer";

require([
  "esri/Map",
  "esri/views/MapView",
  "esri/layers/MapImageLayer",
  "esri/layers/FeatureLayer",
  "esri/Graphic",
  "esri/geometry/Point",
  "esri/widgets/ScaleBar",
  "esri/widgets/Locate",
  "esri/rest/locator",
  "esri/config"
], function (
  Map, MapView,
  MapImageLayer, FeatureLayer,
  Graphic, Point, ScaleBar, Locate, locator, esriConfig
) {
  esriConfig.apiKey = "AAPTxy8BH1VEsoebNVZXo8HurKdAwSbr3tap2eaxJY7Eqwza-FGiC6bjE-hhpBRvGJ2wDnbvdmPI7YFWeiNXNv6su9s4lbgk8V_8AF7vUtQTkgI-5EA5YPbRJgTLnU8DP1qJCTztP8XktMd0xQu99qfTENAzYFXEPc1D-dx7joWwLUqLNFt7ApWKCXPbopJ8oAlWK3wspWKMg0OiMyOmtpo6N0u2d3K5vNHQ_uobPl467zg.AT1_oPY0JXcr";

  const results = document.getElementById("results");
  const isMobile = window.matchMedia("(max-width: 768px)").matches;
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const controls = document.getElementById("controls");
  const stateFilter = document.getElementById("stateFilter");
  const sdsoFilter = document.getElementById("sdsoFilter");

  function collapse() { if (isMobile || isIOS) controls.classList.add("collapsed"); }
  function expand() { if (isMobile || isIOS) controls.classList.remove("collapsed"); }

  // Global variables to be defined after load
  let damFeatureLayer;
  let normalDamLabeling;
  let buildFilterWhere = () => null;

  esriConfig.request.interceptors.push({
    urls: /mapservice\.gov\.in/,
    before: p => {
      p.requestOptions.query = p.requestOptions.query || {};
      const u = p.url;
      if (u.includes("State_Boundary")) p.requestOptions.query.token = "B_MvXZQQA3UJQ3rriTr7Qvo4AE-8f2v0JmAgH3h17-3OVcp7agXot9jS8Q7ZPelzaaShzPs5CR7tqOeucn4Oww..";
      else if (u.includes("District_Boundary")) p.requestOptions.query.token = "KLafX5W7tKxU3qXCTtWzmiub5IsvSYcYf8OYVbFZaO_5Dlji_67_mzrUu6qCgWJ6djeLy_izw-rxbEWms3Ss0g..";
      else if (u.includes("River")) p.requestOptions.query.token = "aprsZsvhLhQlrHeo2O-9F-PWMUmaTr7awaxuyKOXtWOMMp0VVG70sfDnNltnsh3SLOqcK8zLNCvPqBThYxn5tw..";
      else if (u.includes("River Basins")) p.requestOptions.query.token = "LYFmEZL-IKy3-iAuFBbGMpNs0rPaWFMD5KuaJUT7I6OFXUWRxnUhDjR3SJfE-ndgh9aAdyua9Cs8b9POB7R51Q..";
    }
  });

  const stateLayer = new MapImageLayer({
    url: "https://mapservice.gov.in/gismapservice/rest/services/BharatMapService/State_Boundary/MapServer",
    visible: true
  });

  const districtLayer = new MapImageLayer({
    url: "https://mapservice.gov.in/gismapservice/rest/services/BharatMapService/District_Boundary/MapServer",
    visible: false
  });

  const riverLayer = new MapImageLayer({
    url: "https://mapservice.gov.in/gismapservice/rest/services/BharatMapService/River/MapServer",
    visible: false
  });

  const map = new Map({
    basemap: "satellite",
    layers: [stateLayer, districtLayer, riverLayer]
  });

  const view = new MapView({
    container: "viewDiv",
    map,
    extent: { xmin: 68, ymin: 6, xmax: 97, ymax: 37, spatialReference: { wkid: 4326 } },
    popup: isMobile || isIOS ? { dockEnabled: false } : { dockEnabled: true, dockOptions: { position: "top-right", breakpoint: false } }
  });

  const locateWidget = new Locate({
    view: view,
    useHeadingEnabled: false,
    goToOverride: function (view, options) {
      return view.goTo({ target: options.target.target || options.target, scale: 200000 }, { duration: 2000, easing: "ease-in-out" });
    }
  });
  view.ui.add(locateWidget, "top-right");

  if (isMobile || isIOS) {
    controls.classList.add("collapsed");
    controls.addEventListener("click", e => { e.stopPropagation(); controls.classList.remove("collapsed"); });
    view.on("click", () => { controls.classList.add("collapsed"); });
    view.when(() => {
      view.popup.watch("visible", (isVisible) => { if (isVisible) controls.classList.add("collapsed"); });
      view.popup.watch("location", () => { if (view.popup.visible) controls.classList.add("collapsed"); });
    });
  }

  // Labeling configs
  normalDamLabeling = [
    {
      labelExpressionInfo: { expression: "Proper($feature.Name)" },
      minScale: 500000, maxScale: 0,
      labelPlacement: "above-center",
      symbol: { type: "text", color: [255, 180, 90], font: { size: 10, family: "Arial", weight: "bold" }, yoffset: 10 }
    },
    {
      labelExpressionInfo: { expression: "IIf(Number($feature.Gross_storage) >= 500, Proper($feature.Name), '')" },
      minScale: 5000000, maxScale: 500001,
      labelPlacement: "above-center",
      symbol: { type: "text", color: [255, 180, 0], font: { size: 10, family: "Arial", weight: "bold" }, yoffset: 10 }
    }
  ];

  function getForcedLabeling(objectIds) {
    return [{
      labelExpressionInfo: { expression: "Proper($feature.Name)" },
      where: `OBJECTID IN (${objectIds.join(",")})`,
      labelPlacement: "above-center",
      symbol: { type: "text", color: [255, 255, 0], haloColor: [0, 0, 0, 1], haloSize: "2px", font: { size: 11, family: "Arial", weight: "bold" }, yoffset: 10 }
    }];
  }

  // Load Dams and Populate Filters
  fetch("dams.json")
    .then(r => r.json())
    .then(json => {
      const features = json.map((dam, index) => {
        const lat = parseFloat(dam.Latitude);
        const lon = parseFloat(dam.Longitude);
        if (!lat || !lon) return null;
        return {
          geometry: new Point({ longitude: lon, latitude: lat, spatialReference: { wkid: 4326 } }),
          attributes: { OBJECTID: index + 1, Name: dam.Name || "Unknown", ...dam }
        };
      }).filter(f => f !== null);

      const fields = Object.keys(features[0].attributes).map(key => ({
        name: key, alias: key.replace(/_/g, " "),
        type: key === "OBJECTID" ? "oid" : (typeof features[0].attributes[key] === "number" ? "double" : "string")
      }));

      damFeatureLayer = new FeatureLayer({
        source: features, objectIdField: "OBJECTID", fields: fields,
        renderer: {
          type: "simple",
          symbol: { type: "simple-marker", color: [0, 102, 204, 0.9], size: 6, outline: null },
          visualVariables: [{ type: "size", field: "Gross_storage", stops: [{ value: 0, size: 3 }, { value: 500, size: 6 }] }]
        },
        labelingInfo: normalDamLabeling,
        visible: true,
        popupTemplate: {
          title: "{Name}",
          content: [{ type: "fields", fieldInfos: fields.filter(f => f.name !== "OBJECTID").map(f => ({ fieldName: f.name, label: f.alias })) }]
        }
      });
      map.add(damFeatureLayer);

      // --- POPULATE FILTER LOGIC ---
      const stateIndex = new Map();
      const sdsoIndex = new Map();

      features.forEach(f => {
        const state = (f.attributes.State || "").trim();
        const sdso = (f.attributes.SDSO || "").trim();
        if (!state) return;
        if (!stateIndex.has(state)) stateIndex.set(state, new Set());
        if (sdso) {
          stateIndex.get(state).add(sdso);
          sdsoIndex.set(sdso, state);
        }
      });

      [...stateIndex.keys()].sort().forEach(s => {
        const opt = document.createElement("option");
        opt.value = s; opt.textContent = s;
        stateFilter.appendChild(opt);
      });

      function populateSdso(selectedState) {
        sdsoFilter.innerHTML = '<option value="">— All SDSOs —</option>';
        const sdsos = selectedState ? [...(stateIndex.get(selectedState) || [])].sort() : [...sdsoIndex.keys()].sort();
        sdsos.forEach(s => {
          const opt = document.createElement("option");
          opt.value = s; opt.textContent = s;
          sdsoFilter.appendChild(opt);
        });
      }
      populateSdso("");

      buildFilterWhere = function() {
        const st = stateFilter.value;
        const sd = sdsoFilter.value;
        if (sd) return `SDSO = '${sd.replace(/'/g, "''")}'`;
        if (st) return `State = '${st.replace(/'/g, "''")}'`;
        return null;
      };

      function applyFilters() {
        const where = buildFilterWhere();
        damFeatureLayer.definitionExpression = where || null;
        damSearch.value = "";
        results.style.display = "none";
        document.getElementById("clearSearch").style.display = "none";
        view.popup.close();
        if (where) {
          damFeatureLayer.queryExtent({ where }).then(res => { if (res.extent) view.goTo(res.extent.expand(1.3), { duration: 1500 }); });
        }
      }

      stateFilter.onchange = () => { populateSdso(stateFilter.value); applyFilters(); };
      sdsoFilter.onchange = applyFilters;
    })
    .catch(err => console.error("Dams load error:", err));

  // Search functionality
  let currentMatches = [];
  let activeIndex = -1;
  let groupedResults = [];
  let searchMode = "dam";

  damSearch.addEventListener("input", function () {
    const q = this.value.toLowerCase().trim();
    results.innerHTML = ""; results.style.display = "none";
    activeIndex = -1; currentMatches = [];
    document.getElementById("clearSearch").style.display = q ? "block" : "none";
    if (!q || !damFeatureLayer) return;

    const filterWhere = buildFilterWhere();
    const searchWhere = `LOWER(Name) LIKE '%${q.replace(/'/g, "''")}%' OR LOWER(Owner) LIKE '%${q.replace(/'/g, "''")}%' OR LOWER(Health_Cat) LIKE '%${q.replace(/'/g, "''")}%'`;
    
    damFeatureLayer.queryFeatures({
      where: filterWhere ? `(${filterWhere}) AND (${searchWhere})` : searchWhere,
      outFields: ["*"], returnGeometry: true, orderByFields: ["Name ASC"], num: 1000
    }).then(response => {
      currentMatches = response.features;
      if (!currentMatches.length) return;
      results.style.display = "block";

      const ownerMatches = currentMatches.filter(f => (f.attributes.Owner || "").toLowerCase().includes(q));
      const isDamMatch = currentMatches.some(f => (f.attributes.Name || "").toLowerCase().includes(q));

      if (ownerMatches.length && !isDamMatch) {
        searchMode = "owner"; groupedResults = [];
        const groupMap = {};
        ownerMatches.forEach(f => {
          const key = f.attributes.Owner;
          if (!groupMap[key]) groupMap[key] = [];
          groupMap[key].push(f);
        });
        Object.keys(groupMap).forEach((owner, idx) => {
          groupedResults.push({ owner, dams: groupMap[owner] });
          const div = document.createElement("div");
          div.className = "result-item"; div.textContent = `${owner} (${groupMap[owner].length} dams)`;
          div.onclick = () => selectOwner(idx); results.appendChild(div);
        });
      } else {
        searchMode = "dam";
        currentMatches.forEach((f, idx) => {
          const div = document.createElement("div");
          div.className = "result-item"; div.textContent = f.attributes.Name;
          div.onclick = () => selectDam(idx); results.appendChild(div);
        });
      }
    });
  });

  function selectDam(index) {
    const f = currentMatches[index];
    results.style.display = "none"; damSearch.value = f.attributes.Name;
    view.goTo({ target: f.geometry, zoom: 11 }, { duration: 2000 }).then(() => view.popup.open({ features: [f], location: f.geometry }));
  }

  function selectOwner(index) {
    const group = groupedResults[index];
    results.style.display = "none"; damSearch.value = group.owner;
    const ids = group.dams.map(f => f.attributes.OBJECTID);
    damFeatureLayer.definitionExpression = `OBJECTID IN (${ids.join(",")})`;
    damFeatureLayer.labelingInfo = getForcedLabeling(ids);
    view.goTo(group.dams.map(f => f.geometry), { duration: 2000 }).then(() => view.popup.open({ features: group.dams, location: group.dams[0].geometry }));
  }

  document.getElementById("clearSearch").onclick = () => {
    damSearch.value = ""; results.style.display = "none";
    document.getElementById("clearSearch").style.display = "none";
    damFeatureLayer.definitionExpression = buildFilterWhere();
    damFeatureLayer.labelingInfo = normalDamLabeling;
    view.popup.close();
  };

  // Basemap & Layer Toggles
  basemapSelect.onchange = () => {
    map.basemap = basemapSelect.value === "none" ? null : basemapSelect.value === "streets" ? "streets-vector" : basemapSelect.value;
  };
  stateChk.onchange = () => stateLayer.visible = stateChk.checked;
  districtChk.onchange = () => districtLayer.visible = districtChk.checked;
  riverChk.onchange = () => riverLayer.visible = riverChk.checked;
});
</script>
</body>
</html>
